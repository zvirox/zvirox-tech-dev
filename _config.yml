title: "Zvirox"
description: "Zvirox builds open-source desktop and TV software: Easy Edits Pro (video editor), Audio Labs Pro (audio studio), Screen Studio Pro (planned screen recorder) and Your TV Friend (Android TV cleanup tool and launcher)."
url: "https://zvirox.in"

baseurl: ""

author: "Zvirox"
email: "info@zvirox.in"
repository: "zvirox/zvirox-tech-dev"

logo: "/assets/images/zvirox-logo-2026.png"
image: "/assets/images/zvirox-logo-2026.png"

social:
  name: "Zvirox"
  links:
    - "https://github.com/zvirox"
    - "https://github.com/zvirox/easy-edits-pro"
    - "https://github.com/zvirox/audio-labs-pro"
    - "https://github.com/zvirox/screen-studio-pro"
    - "https://github.com/zvirox/your-tv-friend"

twitter:
  card: "summary_large_image"


plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

markdown: kramdown

permalink: /:categories/:title/

exclude:
  - verge-analysis/
  - tests/
  - scripts/
  - plan.md
  - PROJECTS_PORTFOLIO_REPORT.md
  - UI_FIXES_SUMMARY.md
  - ABOUT_PAGE_FIXES.md
  - CHANGELOG.md
  - vendor/
  - Gemfile
  - Gemfile.lock


