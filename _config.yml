title: "Zvirox"
description: "Zvirox builds open-source local-first Linux desktop apps (Starship Control, Screen Studio Pro, Easy Edits Pro, Audio Labs Pro, Agentic Tuneup Pro, Net Watch Pro) and Android TV tools (Your TV Friend)."
url: "https://zvirox.in"

baseurl: ""

author: "Zvirox"
email: "info@zvirox.in"
repository: "zvirox/zvirox-tech-dev"

# NOTE: `logo` is intentionally absent. jekyll-seo-tag uses it to build a
# `publisher` object whose name comes from the page author; with a real Person
# author that would mislabel the Organization. Organization markup is emitted
# explicitly in _layouts/default.html instead.
image: "/assets/images/zvirox-logo.png"

social:
  name: "Zvirox"
  links:
    - "https://github.com/zvirox"
    - "https://github.com/zvirox/starship-control"
    - "https://github.com/zvirox/screen-studio-pro"
    - "https://github.com/zvirox/easy-edits-pro"
    - "https://github.com/zvirox/audio-labs-pro"
    - "https://github.com/zvirox/agentic-tuneup-pro"
    - "https://github.com/zvirox/net-watch-pro"
    - "https://github.com/zvirox/your-tv-friend"

twitter:
  card: "summary_large_image"


plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

markdown: kramdown

permalink: /:categories/:title/

# jekyll-seo-tag reads `image` from page frontmatter only (site.image is ignored).
# Give every page a default social-preview image; articles with their own
# `image:` frontmatter keep their specific hero image.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/zvirox-logo.png

exclude:
  - verge-analysis/
  - tests/
  - scripts/
  - plan.md
  - PROJECTS_PORTFOLIO_REPORT.md
  - UI_FIXES_SUMMARY.md
  - ABOUT_PAGE_FIXES.md
  - CHANGELOG.md
  - vendor/
  - Gemfile
  - Gemfile.lock


